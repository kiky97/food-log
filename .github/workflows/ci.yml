name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 17, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Swiss conversion policy
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test and build with coverage
        run: ./mvnw clean verify -B
      - name: Evaluate matching without coverage instrumentation
        run: ./mvnw test -B -Dtest=MatchingEvaluationTest -Dfoodlog.evaluate=true -Djacoco.skip=true -Dsurefire.reportsDirectory=target/evaluation-test-reports -Devaluation.revision=${{ github.sha }}
      - name: Render evaluation report
        run: python scripts/report_evaluation.py
      - name: Upload evaluation and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          path: |
            target/evaluation/
            target/site/jacoco/
            target/surefire-reports/

  frontend:
    name: Frontend (Node, Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
